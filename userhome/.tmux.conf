# セッション ⊃ ウィンドウ ⊃ ペイン

# tmuxのデフォルトシェル
if-shell 'test "$(uname)" = "Darwin"' \
  'set-option -g default-shell /opt/homebrew/bin/fish' \
  'set-option -g default-shell /usr/bin/fish' 

# 画面分割したときに引き継ぐ環境変数
set-option -g update-environment "PATH"

# true color
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:Tc'

# tmuxline.vim
if-shell "test -f ~/.tmuxline.conf" "source ~/.tmuxline.conf"

# マウス有効化
set-option -g mouse on

# コピーモード時にvimキーバインド
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# コピーモードで辿る履歴
set-option -g history-limit 10000

# Neovim側にフォーカス情報を渡す
set-option -g focus-events on

# neovimでosc52のヤンクしたときにクリップボード共有
set-option -g set-clipboard on

# neovimで:checkhealthしたときにこれ設定しろって言われたやつ
set-option -sg escape-time 10

# ヤンクした文字列のクリップボード連携は set-clipboard on のOSC52に任せる
# (Windows Terminalがホスト側でOSC52を受けるため、ssh越しでもホストのクリップボードに入る)

# alt shift lh :ウインドウ選択
bind -n M-L next-window
bind -n M-H previous-window

# 設定リロード
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# vim-tmux-navigatorの設定
# alt-hjklでvimとtmux関係なく、vimのウィンドウ、tmuxのペインを移動する
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'
# bind-key -n 'M-\/' if-shell "$is_vim" ':vsplit' 'split-window -h -c "#{pane_current_path}"'

# window名の自動リネーム
set-option -g automatic-rename off
set-option -g allow-rename off
set-hook -g after-select-window 'run-shell "tmux rename-window \"$(~/.local/bin/tmux-window-name.sh)\"" '
set-hook -g pane-focus-in 'run-shell "tmux rename-window \"$(~/.local/bin/tmux-window-name.sh)\"" '
set-hook -g after-new-window 'run-shell "tmux rename-window \"$(~/.local/bin/tmux-window-name.sh)\"" '
set-hook -g after-split-window 'run-shell "tmux rename-window \"$(~/.local/bin/tmux-window-name.sh)\"" '

unbind %
bind % split-window -h -c "#{pane_current_path}"
unbind '"'
bind '"' split-window -v -c "#{pane_current_path}"

# 現在のペインを別ウィンドウへ移動 (join-pane)
# 標準には break-pane (prefix !) しかないので、逆操作の join-pane を割り当てる
bind J command-prompt -p "join to window:" "join-pane -t ':%%'"

# 現ペインの履歴を nvim にパイプしてフル vim 操作で閲覧/コピー
# - tmux標準のコピーモード(prefix [)はtext-objectなど効かないので、こちらが本命
# - popup版 (prefix C-p): ぱっと開いて q で消す
# - new-window版 (prefix P): 履歴を持続させたい時
# 実装: bind 内で capture-pane を実行 (-t 省略で呼出元ペインが対象) し
#       named buffer に保存。popup/new-window 側は save-buffer で吐いて nvim に流す
bind C-p capture-pane -J -S - -b pane_history \; \
    display-popup -E -h 90% -w 90% -d '#{pane_current_path}' \
        "tmux save-buffer -b pane_history - | nvim -R -c 'normal G' -; tmux delete-buffer -b pane_history 2>/dev/null"
bind P capture-pane -J -S - -b pane_history \; \
    new-window -n 'pane-history' \
        "tmux save-buffer -b pane_history - | nvim -R -c 'normal G' -; tmux delete-buffer -b pane_history 2>/dev/null"

# ウィンドウの並び順を ±1 入替 (swap-window)
# -r フラグで連続押下可。-d で移動後もそのウィンドウにフォーカスを保つ
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

