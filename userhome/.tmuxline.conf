# minipc用 tmux ステータスバー (ヘリオトロープ)
# 本家のダーク青グレーから色相をシフトし、紫味のあるダークパープルに

set -g status-justify "left"
set -g status "on"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-style "none,bg=#17110f"

set -g message-style "fg=#897089,bg=#2f2230"
set -g message-command-style "fg=#897089,bg=#2f2230"

set -g pane-border-style "fg=#2f2230"
set -g pane-active-border-style "fg=#965888"

setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#3a2c3a,bg=#17110f"

set -g status-left "#[fg=#17110f,bg=#965888,bold] #S #[fg=#965888,bg=#17110f,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#2f2230,bg=#17110f,nobold,nounderscore,noitalics]#[fg=#897089,bg=#2f2230] %Y-%m-%d  %H:%M #[fg=#965888,bg=#2f2230,nobold,nounderscore,noitalics]#[fg=#17110f,bg=#965888,bold] #h "
setw -g window-status-format "#[fg=#3a2c3a,bg=#17110f] #I  #W "
setw -g window-status-current-format "#[fg=#17110f,bg=#2f2230,nobold,nounderscore,noitalics]#[fg=#897089,bg=#2f2230] #I  #W #[fg=#2f2230,bg=#17110f,nobold,nounderscore,noitalics]"
